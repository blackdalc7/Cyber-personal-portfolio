title: LSASS memory dump through comsvcs.dll MiniDump
id: 5c090911-d1d5-4467-ad27-f385bf5a7156
status: stable
description: >
  rundll32 calling comsvcs.dll's MiniDump export is a living-off-the-land LSASS dump that needs no tooling on disk.
references:
  - https://attack.mitre.org/techniques/T1003/001/
author: Watchfloor portfolio
date: 2026-10-01
tags:
  - attack.credential-access
  - attack.t1003.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains|all:
      - comsvcs
      - minidump
  condition: selection
falsepositives:
  - None expected
level: critical
