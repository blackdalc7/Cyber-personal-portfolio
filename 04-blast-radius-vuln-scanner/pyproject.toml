[project]
name = "blast-radius-vuln-scanner"
version = "1.0.0"
description = "Exploitability-first vulnerability prioritisation: Nmap + NVD + EPSS + CISA KEV + NetworkX blast radius, with SARIF output"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
vuln-scanner = "vuln_scanner.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["vuln_scanner"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
