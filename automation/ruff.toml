# Lint configuration (ruff), the same rule set as the numbered projects.
line-length = 120
target-version = "py310"

[lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "C4", "SIM", "RUF"]
ignore = [
  "S101",   # assert is how pytest works
  "RUF001", "RUF002", "RUF003",  # unicode arrows/dashes in docs strings are intentional
  "E402",   # tests put the sibling projects on sys.path before importing them
]

[lint.per-file-ignores]
"**/tests/**" = ["S", "B", "BLE"]

[lint.isort]
known-first-party = ["build_workflows", "soar_bot", "evidence_timeline"]
