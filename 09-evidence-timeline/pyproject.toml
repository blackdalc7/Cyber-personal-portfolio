[project]
name = "evidence-timeline"
version = "1.0.0"
description = "Approval-triggered DFIR collection: Velociraptor + Hayabusa on the endpoint, merged with Watchfloor telemetry into one hashed timeline"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
evidence-timeline = "evidence_timeline.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["src/evidence_timeline"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
