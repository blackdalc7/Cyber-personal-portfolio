# CI for 09-evidence-timeline. Runs when this folder is pushed as its own repository.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUFF_VERSION: "0.17.2"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: py ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: pip install -r requirements-dev.txt "ruff==${RUFF_VERSION}"
      - name: Lint (includes bandit-equivalent S rules)
        run: ruff check .
      - name: Unit tests with coverage gate
        run: pytest --cov --cov-report=term-missing

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pip-audit
      - run: pip-audit --requirement requirements.txt --strict

  docker:
    name: docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: 09-evidence-timeline:ci
      - name: Image runs as non-root
        run: test "$(docker inspect --format '{{.Config.User}}' 09-evidence-timeline:ci)" != ""
