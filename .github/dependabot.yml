# Grouped monthly so updates arrive as one PR per ecosystem instead of dozens of separate ones.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
    schedule: {interval: monthly}
    open-pull-requests-limit: 2
    groups:
      github-actions: {patterns: ["*"]}
  - package-ecosystem: pip
    directories:
      - "/01-realtime-ai-siem"
      - "/02-hitl-soar-bot"
      - "/04-blast-radius-vuln-scanner"
      - "/05-sigma-attack-coverage"
      - "/06-alert-clustering-fp-reducer"
      - "/07-attack-emulator"
      - "/08-detection-rules"
      - "/09-evidence-timeline"
      - "/10-ai-analyst-mcp"
      - "/watchfloor/backend"
    schedule: {interval: monthly}
    open-pull-requests-limit: 2
    groups:
      pip: {patterns: ["*"]}
  - package-ecosystem: docker
    directories:
      - "/01-realtime-ai-siem"
      - "/02-hitl-soar-bot"
      - "/04-blast-radius-vuln-scanner"
      - "/06-alert-clustering-fp-reducer"
      - "/08-detection-rules"
      - "/09-evidence-timeline"
      - "/10-ai-analyst-mcp"
      - "/deploy/watchfloor"
      - "/deploy/velociraptor"
    schedule: {interval: monthly}
    open-pull-requests-limit: 2
    groups:
      docker: {patterns: ["*"]}
  - package-ecosystem: npm
    directories:
      - "/watchfloor/frontend"
      - "/packages/aegis-ui"
    schedule: {interval: monthly}
    open-pull-requests-limit: 2
    groups:
      npm: {patterns: ["*"]}
  - package-ecosystem: docker-compose
    directories:
      - "/deploy"
    schedule: {interval: monthly}
    open-pull-requests-limit: 2
    groups:
      docker-compose: {patterns: ["*"]}
