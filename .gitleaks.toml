# Default gitleaks rules, plus allow-listing of the deliberate, non-secret test values.
[extend]
useDefault = true

[allowlist]
description = "Test fixtures and documentation placeholders"
paths = [
  '''[0-9]{2}-[^/]+/tests/.*''',
  '''[0-9]{2}-[^/]+/\.env\.example''',
]
regexes = [
  '''sk-test''',
]
