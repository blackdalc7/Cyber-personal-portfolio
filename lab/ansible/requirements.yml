# Collections the lab roles use. The full `ansible` pip package already bundles them;
# with ansible-core alone run: ansible-galaxy collection install -r requirements.yml
collections:
  - name: ansible.windows
    version: ">=2.5.0"
  - name: community.windows
    version: ">=2.2.0"
  - name: community.general
    version: ">=9.0.0"
