# Lab inventory. Addresses match the Vagrantfile; credentials are Vagrant's defaults for throwaway lab VMs and
# must never be reused anywhere else. Override with -e or a vault for anything that is not this lab.
all:
  vars:
    lab_net_prefix: "192.168.56"
  children:
    k8s:
      hosts:
        lab-k8s:
          ansible_host: 192.168.56.10
          ansible_user: vagrant
          ansible_ssh_private_key_file: "{{ playbook_dir }}/../.vagrant/machines/lab-k8s/{{ lab_provider | default('virtualbox') }}/private_key"
    windows:
      hosts:
        lab-win01:
          ansible_host: 192.168.56.20
          ansible_user: vagrant
          ansible_password: vagrant
          ansible_connection: winrm
          ansible_winrm_transport: ntlm
          ansible_winrm_server_cert_validation: ignore
          ansible_port: 5985
