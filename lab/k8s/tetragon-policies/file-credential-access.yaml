# T1003.008: reads of /etc/shadow and friends. Mapped by watchfloor's Tetragon mapper to OCSF File System Activity
# (1001, activity Read) and turned into a Detection Finding by 08's rule "Shadow file read by non-root tooling".
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: watchfloor-credential-files
spec:
  kprobes:
    - call: "security_file_permission"
      syscall: false
      return: true
      args:
        - index: 0
          type: "file"
        - index: 1
          type: "int"   # 0x04 MAY_READ, 0x02 MAY_WRITE
      returnArg:
        index: 0
        type: "int"
      returnArgAction: "Post"
      selectors:
        - matchArgs:
            - index: 0
              operator: "Prefix"
              values:
                - "/etc/shadow"
                - "/etc/gshadow"
                - "/etc/sudoers"
                - "/root/.ssh"
            - index: 1
              operator: "Equal"
              values:
                - "4"
