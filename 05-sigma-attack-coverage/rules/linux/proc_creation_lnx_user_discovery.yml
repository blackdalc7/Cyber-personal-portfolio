title: Linux Current User Discovery
id: 3a716fb3-5411-4aa5-ba64-622ad4294336
status: test
description: Detects whoami, id and who, used to learn the current account, its groups and other logged-in users.
references:
    - https://attack.mitre.org/techniques/T1033/
author: Threat Response Portfolio
date: 2026-10-26
tags:
    - attack.discovery
    - attack.t1033
logsource:
    category: process_creation
    product: linux
detection:
    selection:
        Image|endswith:
            - '/whoami'
            - '/id'
            - '/who'
    condition: selection
falsepositives:
    - Shell prompts and scripts that check privileges
level: informational
