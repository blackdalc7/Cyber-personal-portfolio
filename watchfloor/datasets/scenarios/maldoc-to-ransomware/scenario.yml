id: maldoc-to-ransomware
title: Malicious document to ransomware
summary: >-
  A user opens invoice_8841.docm. Word spawns an encoded PowerShell and rundll32, a dropped
  svch0st.exe rewrites a finance share and touches a canary file.
provenance: >-
  Telemetry from 03-edr-canary-process-tree tests/fixtures/maldoc_ransomware_chain.ndjson (kernel ETW
  records), mapped to OCSF. The five EDR alerts are transcribed from the documented output of 03's
  Invoke-SafeSimulation.ps1, in 03's own alert format. The canary alert was sent to 02's real
  SoarService state machine.
hosts: [ws01]
simulated_parts:
  - "03 alerts transcribed from Invoke-SafeSimulation.ps1 output (run it on Windows to regenerate)"
  - "Analyst approval click in 02 (95 s after the incident opened)"
  - "Isolation ran 02's mock_isolate.py in dry-run mode"
stages:
  - id: user-execution
    name: Macro document opened
    tactic: Execution
    techniques: [T1204.002, T1566.001]
    start: "2026-10-26T09:00:10Z"
    host: ws01
    description: WINWORD.EXE opens invoice_8841.docm from Downloads.
  - id: encoded-powershell
    name: Encoded PowerShell from Word
    tactic: Execution
    techniques: [T1059.001]
    start: "2026-10-26T09:00:12Z"
    host: ws01
    description: cmd.exe and powershell -enc launched under Word.
  - id: lolbin
    name: rundll32 proxy execution
    tactic: Defense Evasion
    techniques: [T1218]
    start: "2026-10-26T09:00:13Z"
    host: ws01
    description: Word starts rundll32 against a DLL in C:\Users\Public.
  - id: masquerading
    name: Binary masquerading as svchost
    tactic: Defense Evasion
    techniques: [T1036.005]
    start: "2026-10-26T09:00:20Z"
    host: ws01
    description: svch0st.exe starts from C:\Users\Public. 03 has no rule for this; 08 adds one.
  - id: encryption
    name: Mass file encryption
    tactic: Impact
    techniques: [T1486]
    start: "2026-10-26T09:00:21Z"
    host: ws01
    description: svch0st.exe rewrites 30 files on the finance share.
  - id: canary
    name: Canary file touched
    tactic: Impact
    techniques: [T1485]
    start: "2026-10-26T09:00:26Z"
    host: ws01
    description: The decoy 0_passwords.docx is written.
