[project]
name = "attack-emulator"
version = "1.0.0"
description = "Lab-only Atomic Red Team campaign runner that scores each technique against Watchfloor: detected, telemetry only, prevented or missed"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
attack-emulator = "attack_emulator.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["src/attack_emulator"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
